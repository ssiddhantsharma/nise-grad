[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nise-grad"
version = "0.0.1"
description = "Gradient-based design of small-molecule-binding proteins (differentiable P(bind))"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jax",
    "equinox",
    "numpy",
    "optax",
    "matplotlib",
    "joltz @ git+https://github.com/nboyd/joltz",
    "mosaic @ git+https://github.com/escalante-bio/mosaic",
    "jlig_mpnn @ git+https://github.com/ssiddhantsharma/jlig_mpnn",
]

[tool.hatch.metadata]
allow-direct-references = true  # deps below are git+https (joltz, mosaic, jlig_mpnn)

[tool.hatch.build.targets.wheel]
packages = ["src/nisegrad"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E741"]
