[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nise-grad"
version = "0.0.1"
description = "Gradient-based design of small-molecule-binding proteins (differentiable P(bind))"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jax",
    "numpy",
    "optax",
    "matplotlib",
    "joltz @ git+https://github.com/nboyd/joltz",
    "mosaic @ git+https://github.com/escalante-bio/mosaic",
    # nboyd/jigandmpnn wheel is broken until nboyd/jigandmpnn PR (force-include fix) merges;
    # pin the packaging-fix fork meanwhile so `uv sync` builds cleanly. Switch back to
    # git+https://github.com/nboyd/jigandmpnn once merged.
    "jigandmpnn @ git+https://github.com/ssiddhantsharma/jigandmpnn@fix-wheel-packaging",
]

[tool.hatch.metadata]
allow-direct-references = true  # deps below are git+https (joltz, mosaic, jigandmpnn)

[tool.hatch.build.targets.wheel]
packages = ["src/nisegrad"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# F=pyflakes bugs, I=import-sort, B=bugbear footguns, SIM=simplify, UP=pyupgrade.
# Deliberately omit full E: E501/E70x are line-length/semicolon style noise on JAX scripts.
select = ["F", "I", "B", "SIM", "UP"]
